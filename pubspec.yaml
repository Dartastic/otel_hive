name: otel_hive
description: OpenTelemetry instrumentation for `package:hive`. Box
  extension methods that wrap put/putAll/delete/clear/compact in
  `db.system.name=hive` semconv CLIENT spans.
version: 0.2.0-wip
repository: https://github.com/dartastic/otel_hive
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1
  hive: ^2.2.3

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
