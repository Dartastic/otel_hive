name: otel_hive
description: OpenTelemetry instrumentation for `package:hive` and
  `package:hive_ce`. Extension methods on Box that wrap put/get/delete/
  clear with `db.system=hive` semconv spans.
version: 0.1.0-beta.1-wip
repository: https://github.com/dartastic/otel_hive
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.4
  dartastic_opentelemetry_api: ^1.0.0-beta.6
  hive: ^2.2.3

dev_dependencies:
  pubspec_parse: ^1.5.0
  pub_semver: ^2.0.0
  dart_flutter_team_lints: ^3.5.2
  test: ^1.26.3
